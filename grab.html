<!doctype html><meta charset="utf-8"><title>grab</title>
<body style="font-family:sans-serif;padding:20px"><pre id="log">ready</pre>
<script>
const log=m=>{document.getElementById('log').textContent+='\n'+m;window.__r=m};
function crc32(buf){let c,crc=0xFFFFFFFF;for(let n=0;n<buf.length;n++){c=(crc^buf[n])&0xFF;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c;}return (crc^0xFFFFFFFF)>>>0;}
function zip(files){const enc=new TextEncoder();const parts=[];const central=[];let off=0;
 for(const f of files){const name=enc.encode(f.name);const data=f.data;const crc=crc32(data);
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),name,data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
  central.push(new Uint8Array(ch.buffer),name);off+=30+name.length+data.length;}
 let cdSize=0;central.forEach(p=>cdSize+=p.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);e.setUint16(20,0,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});}
window.grab=async function(prefix){const m=JSON.parse(decodeURIComponent(location.hash.slice(1)));const files=[];
 for(const [id,u] of Object.entries(m)){try{const r=await fetch(u);const b=await r.arrayBuffer();files.push({name:prefix+'-'+id+'.jpg',data:new Uint8Array(b)});log('ok '+id+' '+b.byteLength);}catch(e){log('fail '+id+' '+e.message);}}
 const z=zip(files);const a=document.createElement('a');a.href=URL.createObjectURL(z);a.download=prefix+'-photos.zip';document.body.appendChild(a);a.click();log('zip '+files.length+' files '+z.size+' bytes');};
</script></body>
