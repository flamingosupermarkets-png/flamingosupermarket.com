<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<script>
(async()=>{const p=new URLSearchParams(location.search);const src=p.get('src');
const t=window.opener||(window.parent!==window?window.parent:null);if(!src||!src.startsWith("/img/")||!t)return;
const b=await fetch(src).then(r=>r.blob());
t.postMessage({relayImage:b,name:src.split('/').pop()},'https://adsmanager.facebook.com');
setTimeout(()=>window.close(),1500);})();
</script>
